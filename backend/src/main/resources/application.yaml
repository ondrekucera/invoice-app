# =============================================================
#  Okvion – FINAL
#  Databáze: MySQL přes XAMPP
#  Backend:  Spring Boot 3 na portu 8080
#  Frontend: React (Vite) na portu 5173
# =============================================================

server:
  port: 8080

spring:

  # --- MySQL (XAMPP) ---
  datasource:
    url: jdbc:mysql://localhost:3306/invoice_app?createDatabaseIfNotExist=true&serverTimezone=Europe/Prague&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- JPA / Hibernate ---
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # --- JSON ---
  jackson:
    mapper:
      accept-case-insensitive-enums: true

# --- Swagger / OpenAPI ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
